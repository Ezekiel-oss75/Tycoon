<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Coffee Empire Tycoon</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1a0f0a 0%, #2d1810 100%);
    color: #f5e6d3;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    text-align: center;
    color: #d4a373;
    text-shadow: 0 0 20px #d4a37388;
    margin: 10px 0;
    font-size: 32px;
  }
  .stats {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    padding: 15px;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    border: 1px solid #d4a37333;
  }
  .stat { text-align: center; }
  .stat-value { font-size: 26px; font-weight: bold; color: #ffd700; }
  .stat-label { font-size: 13px; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }

  .container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 1100px;
    margin: 0 auto;
  }
  @media (max-width: 800px) { .container { grid-template-columns: 1fr; } }

  .panel {
    background: rgba(0,0,0,0.35);
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #d4a37333;
  }
  .panel h2 {
    margin-top: 0;
    color: #d4a373;
    font-size: 20px;
    border-bottom: 1px solid #d4a37344;
    padding-bottom: 10px;
  }

  .building {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 8px;
    margin-bottom: 10px;
    transition: 0.2s;
  }
  .building:hover { background: rgba(255,255,255,0.07); }
  .building-icon { font-size: 32px; }
  .building-info { flex: 1; }
  .building-name { font-weight: bold; margin-bottom: 2px; }
  .building-desc { font-size: 12px; opacity: 0.6; }
  .building-count {
    font-size: 20px;
    font-weight: bold;
    color: #ffd700;
    min-width: 40px;
    text-align: center;
  }
  button {
    background: linear-gradient(180deg, #d4a373, #a67c52);
    color: #1a0f0a;
    border: none;
    padding: 10px 14px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
    transition: 0.15s;
    min-width: 130px;
    font-family: inherit;
  }
  button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px #d4a37366;
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  #clickBtn {
    width: 100%;
    padding: 30px;
    font-size: 22px;
    background: radial-gradient(circle, #d4a373, #8b5a2b);
    border-radius: 12px;
    margin-bottom: 15px;
  }
  #clickBtn:active { transform: scale(0.97); }

  .log {
    height: 200px;
    overflow-y: auto;
    font-size: 13px;
    padding-right: 5px;
  }
  .log-entry {
    padding: 5px 0;
    border-bottom: 1px solid #ffffff0a;
    color: #c9a888;
  }
  .log-entry .gold { color: #ffd700; }

  .prestige {
    text-align: center;
    margin-top: 20px;
    padding: 15px;
    background: linear-gradient(135deg, #4a1a6b, #2d1840);
    border-radius: 12px;
    border: 1px solid #a855f7;
  }
  .prestige button {
    background: linear-gradient(180deg, #a855f7, #7c3aed);
    color: #fff;
    padding: 14px 30px;
    font-size: 15px;
  }
  #achievements {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }
  .ach {
    padding: 6px 10px;
    background: #ffd70022;
    border: 1px solid #ffd70066;
    border-radius: 20px;
    font-size: 12px;
    opacity: 0.3;
    transition: 0.3s;
  }
  .ach.unlocked {
    opacity: 1;
    box-shadow: 0 0 15px #ffd70088;
    background: #ffd70033;
  }
</style>
</head>
<body>

<h1>☕ COFFEE EMPIRE TYCOON ☕</h1>

<div class="stats">
  <div class="stat">
    <div class="stat-value" id="money">$0</div>
    <div class="stat-label">Деньги</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="income">$0/с</div>
    <div class="stat-label">Доход</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="totalEarned">$0</div>
    <div class="stat-label">Всего заработано</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="prestigeCount">0</div>
    <div class="stat-label">Престиж</div>
  </div>
</div>

<div class="container">
  <div class="panel">
    <h2>🏗 Бизнесы</h2>
    <div id="buildings"></div>
  </div>

  <div>
    <div class="panel" style="margin-bottom: 20px;">
      <h2>👆 Ручная продажа</h2>
      <button id="clickBtn">Продать кофе<br><small id="clickValue">+$1</small></button>
    </div>

    <div class="panel">
      <h2>📜 События</h2>
      <div class="log" id="log"></div>
    </div>

    <div class="panel" style="margin-top: 20px;">
      <h2>🏆 Достижения</h2>
      <div id="achievements"></div>
    </div>
  </div>
</div>

<div class="prestige" id="prestigeBox" style="max-width: 1100px; margin: 20px auto;">
  <div style="margin-bottom: 10px;">🌟 Престиж: сбросить прогресс ради постоянного бонуса ×2 к доходу</div>
  <button id="prestigeBtn">Престиж (нужно $1M)</button>
</div>

<script>
// ==== СОСТОЯНИЕ ====
const state = {
  money: 0,
  totalEarned: 0,
  prestige: 0,
  clickValue: 1,
  buildings: [
    { id:'cart',   name:'Кофейный киоск',  icon:'🛒', baseCost:15,      income:0.5,   count:0, desc:'Маленький лоток на улице' },
    { id:'cafe',   name:'Кофейня',         icon:'☕', baseCost:150,     income:4,     count:0, desc:'Уютное кафе в центре' },
    { id:'chain',  name:'Сеть кофеен',     icon:'🏪', baseCost:1500,    income:30,    count:0, desc:'Несколько точек в городе' },
    { id:'factory',name:'Фабрика',         icon:'🏭', baseCost:20000,   income:250,   count:0, desc:'Обжарка зёрен в промышленных масштабах' },
    { id:'export', name:'Экспорт',         icon:'🚢', baseCost:250000,  income:2000,  count:0, desc:'Поставки по всему миру' },
    { id:'brand',  name:'Мировой бренд',   icon:'🌍', baseCost:3000000, income:25000, count:0, desc:'Ваш логотип знают везде' },
  ],
  achievements: [
    { id:'a1', name:'Первые $100',    check:s=>s.totalEarned>=100,        unlocked:false },
    { id:'a2', name:'Первые $10K',    check:s=>s.totalEarned>=10000,      unlocked:false },
    { id:'a3', name:'Миллионер',      check:s=>s.totalEarned>=1000000,    unlocked:false },
    { id:'a4', name:'10 киосков',     check:s=>s.buildings[0].count>=10,  unlocked:false },
    { id:'a5', name:'Собственник',    check:s=>s.buildings[1].count>=1,   unlocked:false },
    { id:'a6', name:'Империя',        check:s=>s.buildings[3].count>=1,   unlocked:false },
    { id:'a7', name:'Магнат',         check:s=>s.buildings[4].count>=1,   unlocked:false },
    { id:'a8', name:'Легенда',        check:s=>s.buildings[5].count>=1,   unlocked:false },
    { id:'a9', name:'Престиж I',      check:s=>s.prestige>=1,             unlocked:false },
  ]
};

// ==== УТИЛИТЫ ====
function fmt(n) {
  if (n >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return '$' + (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6)  return '$' + (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3)  return '$' + (n/1e3).toFixed(2) + 'K';
  return '$' + n.toFixed(2);
}

function costOf(b) {
  // Формула: baseCost * 1.15^count
  return Math.floor(b.baseCost * Math.pow(1.15, b.count));
}

function prestigeMultiplier() {
  return 1 + state.prestige; // ×2, ×3, ×4 ...
}

function totalIncome() {
  let sum = 0;
  state.buildings.forEach(b => sum += b.income * b.count);
  return sum * prestigeMultiplier();
}

// ==== ЛОГ ====
const logEl = document.getElementById('log');
function log(msg) {
  const div = document.createElement('div');
  div.className = 'log-entry';
  div.innerHTML = msg;
  logEl.prepend(div);
  while (logEl.children.length > 30) logEl.lastChild.remove();
}

// ==== ОТРИСОВКА ЗДАНИЙ ====
const buildingsEl = document.getElementById('buildings');
function renderBuildings() {
  buildingsEl.innerHTML = '';
  state.buildings.forEach((b, i) => {
    const cost = costOf(b);
    const canBuy = state.money >= cost;
    const el = document.createElement('div');
    el.className = 'building';
    el.innerHTML = `
      <div class="building-icon">${b.icon}</div>
      <div class="building-info">
        <div class="building-name">${b.name}</div>
        <div class="building-desc">${b.desc} · +${fmt(b.income * prestigeMultiplier())}/с за шт.</div>
      </div>
      <div class="building-count">${b.count}</div>
      <button ${canBuy?'':'disabled'} data-idx="${i}">
        Купить<br>${fmt(cost)}
      </button>
    `;
    el.querySelector('button').onclick = () => buyBuilding(i);
    buildingsEl.appendChild(el);
  });
}

function buyBuilding(i) {
  const b = state.buildings[i];
  const cost = costOf(b);
  if (state.money < cost) return;
  state.money -= cost;
  b.count++;
  log(`🏗 Куплено: <b>${b.name}</b> за <span class="gold">${fmt(cost)}</span>`);
  renderAll();
}

// ==== РУЧНАЯ ПРОДАЖА ====
document.getElementById('clickBtn').onclick = () => {
  const gain = state.clickValue * prestigeMultiplier();
  state.money += gain;
  state.totalEarned += gain;
  renderStats();
  // микро-эффект
  const btn = document.getElementById('clickBtn');
  btn.style.transform = 'scale(0.95)';
  setTimeout(() => btn.style.transform = '', 80);
};

// ==== ДОСТИЖЕНИЯ ====
const achEl = document.getElementById('achievements');
function renderAchievements() {
  achEl.innerHTML = '';
  state.achievements.forEach(a => {
    if (!a.unlocked && a.check(state)) {
      a.unlocked = true;
      log(`🏆 Достижение: <b>${a.name}</b>!`);
      // бонус за достижение: +5% к clickValue
      state.clickValue *= 1.05;
    }
    const el = document.createElement('div');
    el.className = 'ach' + (a.unlocked ? ' unlocked' : '');
    el.textContent = (a.unlocked?'🏆 ':'🔒 ') + a.name;
    achEl.appendChild(el);
  });
}

// ==== ПРЕСТИЖ ====
document.getElementById('prestigeBtn').onclick = () => {
  if (state.totalEarned < 1000000) {
    alert('Нужно заработать минимум $1M за всю игру для престижа!');
    return;
  }
  if (!confirm('Сбросить весь прогресс и получить ×2 к доходу навсегда?')) return;
  state.prestige++;
  state.money = 0;
  state.totalEarned = 0;
  state.clickValue = 1;
  state.buildings.forEach(b => b.count = 0);
  log(`🌟 <b>ПРЕСТИЖ ${state.prestige}!</b> Множитель дохода: ×${prestigeMultiplier()}`);
  renderAll();
};

// ==== ОБНОВЛЕНИЕ UI ====
function renderStats() {
  document.getElementById('money').textContent = fmt(state.money);
  document.getElementById('income').textContent = fmt(totalIncome()) + '/с';
  document.getElementById('totalEarned').textContent = fmt(state.totalEarned);
  document.getElementById('prestigeCount').textContent = state.prestige;
  document.getElementById('clickValue').textContent = '+' + fmt(state.clickValue * prestigeMultiplier()).replace('$','$');
}

function renderAll() {
  renderStats();
  renderBuildings();
  renderAchievements();
}

// ==== ИГРОВОЙ ЦИКЛ ====
let last = performance.now();
function tick(now) {
  const dt = Math.min((now - last) / 1000, 1); // сек, макс 1с чтобы не было скачков
  last = now;

  const gain = totalIncome() * dt;
  state.money += gain;
  state.totalEarned += gain;

  renderStats();

  // Перерисовка кнопок покупки раз в ~0.5с, чтобы обновлять доступность
  if (!tick._c || now - tick._c > 400) {
    renderBuildings();
    renderAchievements();
    tick._c = now;
  }

  requestAnimationFrame(tick);
}

// ==== СТАРТ ====
log('☕ Добро пожаловать в Coffee Empire! Начните с ручной продажи.');
log('💡 Совет: покупайте киоски для пассивного дохода.');
renderAll();
requestAnimationFrame(tick);
</script>
</body>
</html>
