<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Idle Airport Tycoon</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #0e1220;
    color: #e8eef7;
    overflow: hidden;
    height: 100%;
    user-select: none;
  }
  #game { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

  /* ==== HUD ВЕРХ ==== */
  .hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; gap: 8px;
    padding: 10px;
    z-index: 10;
    pointer-events: none;
  }
  .hud-card {
    background: rgba(14,18,32,0.9);
    border: 1px solid #2a3a5c;
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 13px;
    backdrop-filter: blur(10px);
    display: flex; flex-direction: column;
    min-width: 90px;
  }
  .hud-card .val { font-weight: 700; font-size: 16px; color: #4ade80; }
  .hud-card .lbl { font-size: 10px; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.5px; }
  .hud-card.blue .val { color: #60a5fa; }
  .hud-card.gold .val { color: #fbbf24; }

  /* ==== СЦЕНА ==== */
  #scene {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #1a2440 0%, #0e1220 100%);
  }
  #scene canvas { display: block; width: 100%; height: 100%; }

  /* ==== НИЖНЯЯ ПАНЕЛЬ ==== */
  .tabs {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(14,18,32,0.95);
    border-top: 1px solid #2a3a5c;
    display: flex;
    z-index: 20;
    backdrop-filter: blur(10px);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1;
    padding: 10px 5px;
    text-align: center;
    font-size: 10px;
    color: #7d8aa3;
    cursor: pointer;
    transition: 0.2s;
    border: none;
    background: none;
    font-family: inherit;
  }
  .tab.active { color: #60a5fa; }
  .tab .icon { font-size: 22px; display: block; margin-bottom: 2px; }
  .tab .badge {
    position: absolute;
    background: #ef4444;
    color: #fff;
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 8px;
    top: 4px;
    margin-left: 12px;
    font-weight: bold;
  }

  /* ==== ПАНЕЛЬ КОНТЕНТА ==== */
  .panel {
    position: absolute;
    bottom: 66px; left: 0; right: 0;
    max-height: 55vh;
    background: rgba(14,18,32,0.97);
    border-top: 1px solid #2a3a5c;
    border-radius: 16px 16px 0 0;
    padding: 14px;
    overflow-y: auto;
    transform: translateY(110%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 15;
    backdrop-filter: blur(10px);
  }
  .panel.open { transform: translateY(0); }
  .panel h3 { margin: 0 0 10px; color: #60a5fa; font-size: 15px; }
  .panel .close {
    position: absolute; top: 14px; right: 16px;
    background: none; border: none; color: #7d8aa3; font-size: 22px; cursor: pointer;
    padding: 0; width: 28px; height: 28px;
  }

  /* ==== ЭЛЕМЕНТЫ СПИСКА ==== */
  .item {
    display: flex;
    gap: 10px;
    align-items: center;
    background: #182236;
    border: 1px solid #2a3a5c;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 8px;
    transition: 0.15s;
  }
  .item:active { transform: scale(0.99); }
  .item .ic { font-size: 26px; min-width: 34px; text-align: center; }
  .item .info { flex: 1; min-width: 0; }
  .item .name { font-size: 14px; font-weight: 600; }
  .item .desc { font-size: 11px; opacity: 0.65; margin-top: 2px; line-height: 1.3; }
  .item .lvl { color: #fbbf24; font-size: 12px; font-weight: 700; }

  .btn {
    background: linear-gradient(180deg, #3b82f6, #2563eb);
    color: #fff; border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: 0.15s;
  }
  .btn:active:not(:disabled) { transform: scale(0.95); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn.green { background: linear-gradient(180deg, #10b981, #059669); }
  .btn.gold  { background: linear-gradient(180deg, #f59e0b, #d97706); }

  /* ==== ВСПЛЫВАЮЩИЙ ДОХОД ==== */
  .popup {
    position: absolute;
    color: #4ade80;
    font-weight: 700;
    font-size: 16px;
    pointer-events: none;
    z-index: 30;
    text-shadow: 0 2px 4px #000;
    animation: rise 1s ease-out forwards;
  }
  @keyframes rise {
    from { transform: translateY(0); opacity: 1; }
    to   { transform: translateY(-60px); opacity: 0; }
  }

  /* ==== УВЕДОМЛЕНИЕ ==== */
  .toast {
    position: absolute;
    top: 70px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(20,30,50,0.98);
    border: 1px solid #3b82f6;
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    transition: 0.3s;
    z-index: 50;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="game">
  <div id="scene"><canvas id="cv"></canvas></div>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-card gold">
      <span class="val" id="money">$0</span>
      <span class="lbl">Деньги</span>
    </div>
    <div class="hud-card blue">
      <span class="val" id="income">$0/с</span>
      <span class="lbl">Доход</span>
    </div>
    <div class="hud-card">
      <span class="val" id="pax">0</span>
      <span class="lbl">Пассажиров</span>
    </div>
  </div>

  <!-- Панель -->
  <div class="panel" id="panel">
    <button class="close" id="closePanel">×</button>
    <h3 id="panelTitle">—</h3>
    <div id="panelBody"></div>
  </div>

  <!-- Вкладки -->
  <div class="tabs">
    <button class="tab active" data-tab="terminal"><span class="icon">🏢</span>Терминал</button>
    <button class="tab" data-tab="staff"><span class="icon">👥</span>Персонал</button>
    <button class="tab" data-tab="planes"><span class="icon">✈️</span>Самолёты</button>
    <button class="tab" data-tab="upgrades"><span class="icon">⚡</span>Апгрейды</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ============================================================
   IDLE AIRPORT TYCOON
   ============================================================ */

const $ = id => document.getElementById(id);
const fmt = n => {
  n = Math.floor(n);
  if (n >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return '$' + (n/1e9).toFixed(2)  + 'B';
  if (n >= 1e6)  return '$' + (n/1e6).toFixed(2)  + 'M';
  if (n >= 1e3)  return '$' + (n/1e3).toFixed(1)  + 'K';
  return '$' + n;
};

/* ---------- СОСТОЯНИЕ ---------- */
const S = {
  money: 50,
  pax: 0,              // сколько пассажиров сейчас в терминале
  lastSave: Date.now(),
  lastTick: performance.now(),
  totalEarned: 0,
  ratePerPax: 1,       // сколько $ приносит 1 обслуженный пассажир

  // Терминал: сколько слотов регистрации, сколько открыто
  counters: { total: 2, open: 2, price: 250 },

  // Стойки самообслуживания
  kiosks: { count: 0, price: 800 },

  // Магазины (пассивный доход)
  shops: { count: 0, price: 5000 },

  // Полоса / ангар
  runwayLvl: 0,
  runwayPrice: 50000,

  // Персонал
  staff: {
    cashier:   { count: 2, price: 100,   income: 0.5, name: 'Кассир',          icon: '💺', desc: 'Обрабатывает пассажиров быстрее' },
    security:  { count: 0, price: 600,   income: 2,   name: 'Охранник',        icon: '🛡', desc: '+безопасность, +репутация' },
    cleaner:   { count: 0, price: 350,   income: 1.2, name: 'Уборщик',         icon: '🧹', desc: 'Чистота = довольные пассажиры' },
    steward:   { count: 0, price: 1200,  income: 4,   name: 'Стюардесса',      icon: '👩‍✈️', desc: 'Обслуживание на борту' },
    manager:   { count: 0, price: 5000,  income: 15,  name: 'Менеджер',        icon: '👔', desc: 'Ускоряет всю работу' },
    pilot:     { count: 1, price: 8000,  income: 25,  name: 'Пилот',           icon: '🧑‍✈️', desc: 'Больше рейсов в день' },
  },

  planes: [
    { id:'cessna',  name:'Cessna 172',   icon:'🛩', count:0, price:5000,     income:8,    capacity:4,   desc:'Малая авиация' },
    { id:'atr',     name:'ATR 72',       icon:'✈️', count:0, price:80000,    income:60,   capacity:70,  desc:'Региональный' },
    { id:'boeing',  name:'Boeing 737',   icon:'🛫', count:0, price:900000,   income:400,  capacity:180, desc:'Среднемагистральный' },
    { id:'dream',   name:'Boeing 787',   icon:'🛬', count:0, price:12000000, income:3000, capacity:290, desc:'Дальнемагистральный' },
    { id:'a380',    name:'Airbus A380',  icon:'🛩️', count:0, price:200000000, income:25000, capacity:525, desc:'Двухпалубный гигант' },
  ],

  upgrades: [
    { id:'wifi',    name:'Wi-Fi в терминале',       icon:'📶', bought:false, price:15000,    effect:'+10% к доходу',      mult:1.10 },
    { id:'vip',     name:'VIP-зал',                 icon:'💎', bought:false, price:200000,   effect:'+15% к доходу',      mult:1.15 },
    { id:'duty',    name:'Duty Free',               icon:'🛍', bought:false, price:1500000,  effect:'+20% к доходу',      mult:1.20 },
    { id:'monorail',name:'Монорельс',               icon:'🚝', bought:false, price:20000000, effect:'+25% к доходу',      mult:1.25 },
    { id:'ads',     name:'Реклама в аэропорту',     icon:'📺', bought:false, price:50000000, effect:'+30% к доходу',      mult:1.30 },
    { id:'hub',     name:'Хаб авиакомпаний',        icon:'🌐', bought:false, price:500000000,effect:'+50% к доходу',      mult:1.50 },
  ],

  mult: 1,   // общий множитель от апгрейдов
};

/* ---------- ФОРМУЛЫ ---------- */
// Стоимость N-го объекта: price * 1.15^count
const priceOf = (base, count) => Math.floor(base * Math.pow(1.15, count));

// Общий доход в секунду
function calcIncome() {
  let inc = 0;
  // Персонал
  for (const k in S.staff) inc += S.staff[k].income * S.staff[k].count;
  // Самолёты
  S.planes.forEach(p => inc += p.income * p.count);
  // Магазины
  inc += S.shops.count * 20;
  // Самообслуживание
  inc += S.kiosks.count * 5;
  // Множитель апгрейдов
  inc *= S.mult;
  // Множитель от открытых стоек (чем больше открыто — тем лучше)
  inc *= (1 + S.counters.open * 0.05);
  return inc;
}

/* ---------- РЕНДЕР HUD ---------- */
function renderHUD() {
  $('money').textContent   = fmt(S.money);
  $('income').textContent  = fmt(calcIncome()) + '/с';
  $('pax').textContent     = Math.floor(S.pax);
}

/* ---------- ПАНЕЛИ ---------- */
const panel = $('panel');
const panelTitle = $('panelTitle');
const panelBody = $('panelBody');
let currentTab = 'terminal';

function openPanel(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderPanel();
  panel.classList.add('open');
}
function closePanel() { panel.classList.remove('open'); }
$('closePanel').onclick = closePanel;

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    if (currentTab === t.dataset.tab && panel.classList.contains('open')) {
      closePanel();
    } else {
      openPanel(t.dataset.tab);
    }
  };
});

function renderPanel() {
  if (currentTab === 'terminal') renderTerminal();
  else if (currentTab === 'staff') renderStaff();
  else if (currentTab === 'planes') renderPlanes();
  else if (currentTab === 'upgrades') renderUpgrades();
}

/* ---- Вкладка: ТЕРМИНАЛ ---- */
function renderTerminal() {
  panelTitle.textContent = '🏢 Терминал';
  const countersPrice = S.counters.price;
  const kioskPrice = priceOf(S.kiosks.price, S.kiosks.count);
  const shopPrice = priceOf(S.shops.price, S.shops.count);

  panelBody.innerHTML = `
    ${itemHTML('🚪', 'Открыть стойку',
      `Открыто: ${S.counters.open} / ${S.counters.total}. +5% к доходу за стойку.`,
      `$${countersPrice}`,
      'counter', S.money >= countersPrice)}

    ${itemHTML('🖥️', 'Стойка самообслуживания',
      `Куплено: ${S.kiosks.count}. +$5/с. Автоматически обслуживает пассажиров.`,
      fmt(kioskPrice),
      'kiosk', S.money >= kioskPrice)}

    ${itemHTML('🛒', 'Магазин в терминале',
      `Куплено: ${S.shops.count}. +$20/с. Пассажиры тратят деньги в ожидании.`,
      fmt(shopPrice),
      'shop', S.money >= shopPrice)}

    ${itemHTML('🛫', 'Взлётная полоса ур.' + (S.runwayLvl + 1),
      `Нужна для крупных самолётов. Сейчас ур. ${S.runwayLvl}`,
      fmt(S.runwayPrice),
      'runway', S.money >= S.runwayPrice)}
  `;

  panelBody.querySelectorAll('button[data-act]').forEach(b => {
    b.onclick = () => terminalAction(b.dataset.act);
  });
}

function terminalAction(act) {
  if (act === 'counter' && S.money >= S.counters.price) {
    S.money -= S.counters.price;
    S.counters.open++;
    S.counters.total++;
    S.counters.price = Math.floor(S.counters.price * 1.6);
    toast('🚪 Стойка открыта!');
  }
  else if (act === 'kiosk') {
    const p = priceOf(S.kiosks.price, S.kiosks.count);
    if (S.money >= p) { S.money -= p; S.kiosks.count++; }
  }
  else if (act === 'shop') {
    const p = priceOf(S.shops.price, S.shops.count);
    if (S.money >= p) { S.money -= p; S.shops.count++; }
  }
  else if (act === 'runway' && S.money >= S.runwayPrice) {
    S.money -= S.runwayPrice;
    S.runwayLvl++;
    S.runwayPrice = Math.floor(S.runwayPrice * 2.2);
    toast('🛫 Полоса улучшена!');
  }
  renderPanel();
  renderHUD();
}

/* ---- Вкладка: ПЕРСОНАЛ ---- */
function renderStaff() {
  panelTitle.textContent = '👥 Персонал';
  panelBody.innerHTML = Object.entries(S.staff).map(([id, s]) => {
    const price = priceOf(s.price, s.count);
    return itemHTML(s.icon, s.name,
      `${s.desc} · +$${s.income}/с за шт.`,
      fmt(price),
      'staff:' + id, S.money >= price,
      s.count);
  }).join('');

  panelBody.querySelectorAll('button[data-act]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.act.split(':')[1];
      const s = S.staff[id];
      const p = priceOf(s.price, s.count);
      if (S.money >= p) {
        S.money -= p;
        s.count++;
        toast(`${s.icon} Нанят: ${s.name}`);
        renderPanel();
        renderHUD();
      }
    };
  });
}

/* ---- Вкладка: САМОЛЁТЫ ---- */
function renderPlanes() {
  panelTitle.textContent = '✈️ Флот';
  panelBody.innerHTML = S.planes.map(p => {
    const price = priceOf(p.price, p.count);
    const needRunway = ['boeing','dream','a380'].includes(p.id) && S.runwayLvl < 1;
    const needRunway2 = ['dream','a380'].includes(p.id) && S.runwayLvl < 2;
    const locked = needRunway || needRunway2;
    const canBuy = !locked && S.money >= price;
    return itemHTML(p.icon, p.name,
      `${p.desc} · ${p.capacity} мест · +$${p.income}/с за шт. ${locked ? '🔒 Нужна полоса ур.' + (needRunway ? 1 : 2) : ''}`,
      fmt(price),
      'plane:' + p.id, canBuy,
      p.count);
  }).join('');

  panelBody.querySelectorAll('button[data-act]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.act.split(':')[1];
      const p = S.planes.find(x => x.id === id);
      const pr = priceOf(p.price, p.count);
      if (S.money >= pr) {
        S.money -= pr;
        p.count++;
        toast(`✈️ Куплен: ${p.name}`);
        renderPanel();
        renderHUD();
      }
    };
  });
}

/* ---- Вкладка: АПГРЕЙДЫ ---- */
function renderUpgrades() {
  panelTitle.textContent = '⚡ Улучшения';
  panelBody.innerHTML = S.upgrades.map(u => {
    if (u.bought) {
      return `<div class="item" style="opacity:0.5">
        <div class="ic">${u.icon}</div>
        <div class="info"><div class="name">${u.name} ✓</div>
        <div class="desc">${u.effect} · Куплено</div></div>
      </div>`;
    }
    return itemHTML(u.icon, u.name, u.effect, fmt(u.price), 'upg:' + u.id, S.money >= u.price);
  }).join('');

  panelBody.querySelectorAll('button[data-act]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.act.split(':')[1];
      const u = S.upgrades.find(x => x.id === id);
      if (!u.bought && S.money >= u.price) {
        S.money -= u.price;
        u.bought = true;
        S.mult *= u.mult;
        toast(`⚡ Куплено: ${u.name}`);
        renderPanel();
        renderHUD();
      }
    };
  });
}

/* ---- HTML-ШАБЛОН ЭЛЕМЕНТА ---- */
function itemHTML(icon, name, desc, price, act, enabled, count) {
  const countBadge = (count !== undefined) ? `<span class="lvl">×${count}</span>` : '';
  return `
    <div class="item">
      <div class="ic">${icon}</div>
      <div class="info">
        <div class="name">${name} ${countBadge}</div>
        <div class="desc">${desc}</div>
      </div>
      <button class="btn" data-act="${act}" ${enabled ? '' : 'disabled'}>${price}</button>
    </div>`;
}

/* ---------- TOAST ---------- */
let toastTimer;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

/* ---------- CANVAS: ИЗОМЕТРИЧЕСКИЙ АЭРОПОРТ ---------- */
const cv = $('cv');
const ctx = cv.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);

/* Пассажиры: живые человечки, которые ходят от входа к стойкам */
const passengers = [];
const MAX_PAX = 40;

function spawnPassenger() {
  if (passengers.length >= MAX_PAX) return;
  const p = {
    t: 0,
    speed: 0.3 + Math.random() * 0.3,
    color: `hsl(${Math.random()*360}, 70%, 60%)`,
    skin: ['#f5d0a9','#d4a373','#8b5a2b','#f9e0c2'][Math.floor(Math.random()*4)],
    offset: (Math.random() - 0.5) * 0.3,
  };
  passengers.push(p);
  S.pax = passengers.length;
}

/* Анимация пассажира: путь от входа (слева) к стойкам и исчезает */
function updatePassengers(dt) {
  for (let i = passengers.length - 1; i >= 0; i--) {
    const p = passengers[i];
    p.t += p.speed * dt * 0.15;
    if (p.t >= 1) {
      // Обслужен — деньги!
      const gain = S.ratePerPax * (1 + S.counters.open * 0.05) * S.mult;
      S.money += gain;
      S.totalEarned += gain;
      passengers.splice(i, 1);
      S.pax = passengers.length;
    }
  }
}

/* Рисуем сцену */
let time = 0;
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Фон — зал терминала (изометрия сверху)
  const groundY = H * 0.35;
  const cx = W / 2;

  // Пол терминала (изометрическая трапеция)
  ctx.fillStyle = '#141c30';
  ctx.beginPath();
  ctx.moveTo(cx - W*0.45, H*0.85);
  ctx.lineTo(cx + W*0.45, H*0.85);
  ctx.lineTo(cx + W*0.35, H*0.30);
  ctx.lineTo(cx - W*0.35, H*0.30);
  ctx.closePath();
  ctx.fill();

  // Линии на полу (плитка)
  ctx.strokeStyle = 'rgba(96,165,250,0.08)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 10; i++) {
    const y = H*0.30 + (H*0.55) * (i/10);
    ctx.beginPath();
    ctx.moveTo(cx - W*0.35 - (i*0.01*W), y);
    ctx.lineTo(cx + W*0.35 + (i*0.01*W), y);
    ctx.stroke();
  }

  // Стойки регистрации (синие блоки)
  const counters = S.counters.open;
  for (let i = 0; i < counters; i++) {
    const x = cx - (counters-1) * 55 / 2 + i * 55;
    const y = H * 0.55;
    drawCounter(x, y);
  }

  // Kiosks (автоматические стойки)
  for (let i = 0; i < Math.min(S.kiosks.count, 8); i++) {
    const x = cx - 180 + (i % 4) * 55;
    const y = H * 0.72 + Math.floor(i / 4) * 40;
    drawKiosk(x, y);
  }

  // Пассажиры
  passengers.forEach(p => drawPassenger(p));

  // Самолёты на фоне (вверху, за терминалом)
  drawSky();

  // Уведомления о доходе (плюс к деньгам — медленно капаем)
  time += 1;
}

function drawSky() {
  // Небо
  const skyH = H * 0.30;
  const g = ctx.createLinearGradient(0, 0, 0, skyH);
  g.addColorStop(0, '#1e3a8a');
  g.addColorStop(1, '#1a2440');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, skyH);

  // Звёзды
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 30; i++) {
    const x = (i * 137 + time * 0.2) % W;
    const y = (i * 73) % skyH;
    ctx.globalAlpha = 0.3 + Math.sin(time * 0.02 + i) * 0.2;
    ctx.fillRect(x, y, 1.5, 1.5);
  }
  ctx.globalAlpha = 1;

  // Самолёты летят по небу — по 1 за каждый купленный
  let planeIdx = 0;
  S.planes.forEach(p => {
    for (let i = 0; i < Math.min(p.count, 3); i++) {
      const speed = 0.3 + planeIdx * 0.1;
      const x = ((time * speed + planeIdx * 250) % (W + 200)) - 100;
      const y = 40 + planeIdx * 22;
      ctx.font = '22px sans-serif';
      ctx.fillText(p.icon, x, y);
      planeIdx++;
    }
  });
}

function drawCounter(x, y) {
  // Стол
  ctx.fillStyle = '#2563eb';
  ctx.fillRect(x - 22, y - 8, 44, 16);
  ctx.fillStyle = '#1e40af';
  ctx.fillRect(x - 22, y + 8, 44, 6);
  // Монитор
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(x - 10, y - 22, 20, 12);
  ctx.fillStyle = '#4ade80';
  ctx.fillRect(x - 8, y - 20, 16, 8);
  // Табличка над стойкой
  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('✈', x, y - 26);
}

function drawKiosk(x, y) {
  ctx.fillStyle = '#0f766e';
  ctx.fillRect(x - 12, y - 16, 24, 32);
  ctx.fillStyle = '#14b8a6';
  ctx.fillRect(x - 10, y - 14, 20, 12);
  ctx.fillStyle = '#0d9488';
  ctx.fillRect(x - 8, y + 2, 16, 10);
}

function drawPassenger(p) {
  // Путь: от входа (левый низ) к стойкам (центр)
  const startX = W * 0.12;
  const startY = H * 0.80;
  const endX = W * 0.5 + p.offset * 100;
  const endY = H * 0.58;

  const x = startX + (endX - startX) * p.t;
  const y = startY + (endY - startY) * p.t;

  // Тело
  ctx.fillStyle = p.color;
  ctx.fillRect(x - 4, y - 10, 8, 12);
  // Голова
  ctx.fillStyle = p.skin;
  ctx.beginPath();
  ctx.arc(x, y - 13, 4, 0, Math.PI * 2);
  ctx.fill();
  // Ноги (анимация)
  const legPhase = Math.sin(time * 0.3 + p.t * 20) * 3;
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - 2, y + 2); ctx.lineTo(x - 2 + legPhase, y + 8);
  ctx.moveTo(x + 2, y + 2); ctx.lineTo(x + 2 - legPhase, y + 8);
  ctx.stroke();
}

/* ---------- ИГРОВОЙ ЦИКЛ ---------- */
let spawnTimer = 0;
let saveTimer = 0;

function loop(now) {
  const dt = Math.min((now - S.lastTick) / 1000, 0.1);
  S.lastTick = now;

  // Доход в секунду
  const inc = calcIncome() * dt;
  S.money += inc;
  S.totalEarned += inc;

  // Спавн пассажиров
  spawnTimer += dt;
  const spawnRate = 0.4 / (1 + S.counters.open * 0.1); // чаще с ростом
  if (spawnTimer > spawnRate) {
    spawnPassenger();
    spawnTimer = 0;
  }

  updatePassengers(dt);
  draw();
  renderHUD();

  // Автосохранение раз в 5 сек
  saveTimer += dt;
  if (saveTimer > 5) { save(); saveTimer = 0; }

  requestAnimationFrame(loop);
}

/* ---------- СОХРАНЕНИЕ ---------- */
function save() {
  S.lastSave = Date.now();
  localStorage.setItem('airportTycoon', JSON.stringify(S));
}
function load() {
  try {
    const raw = localStorage.getItem('airportTycoon');
    if (!raw) return;
    const data = JSON.parse(raw);
    // Оффлайн-доход (максимум 8 часов)
    const offlineMs = Math.min(Date.now() - data.lastSave, 8 * 3600 * 1000);
    const offlineSec = offlineMs / 1000;

    Object.assign(S, data);

    const offlineIncome = calcIncome() * offlineSec;
    if (offlineIncome > 1 && offlineSec > 60) {
      S.money += offlineIncome;
      S.totalEarned += offlineIncome;
      setTimeout(() => toast(`💤 Оффлайн-доход: ${fmt(offlineIncome)}`), 500);
    }
  } catch(e) { console.warn('Save error', e); }
}

/* ---------- СТАРТ ---------- */
resize();
load();
renderHUD();
requestAnimationFrame(loop);

// Первое открытие панели
setTimeout(() => openPanel('terminal'), 300);
</script>
